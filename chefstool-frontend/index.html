<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)" />
    <script>
      // Aplica el tema antes de pintar para que no haya un destello claro.
      try {
        var tema = localStorage.getItem('chefstool.tema')
        if (tema !== 'claro' && tema !== 'oscuro') {
          tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
        }
        document.documentElement.classList.toggle('dark', tema === 'oscuro')
        document.documentElement.style.colorScheme = tema === 'oscuro' ? 'dark' : 'light'
      } catch (error) {
        /* sin almacenamiento: se queda el tema del sistema */
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chefstool" />
    <meta
      name="description"
      content="Control de compras y costes para cocinas profesionales"
    />
    <title>Chefstool — Control de costes para cocinas profesionales</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
