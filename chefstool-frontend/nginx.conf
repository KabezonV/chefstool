server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La aplicacion es una SPA: cualquier ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La API vive en el mismo dominio: sin CORS y sin configurar URLs en el frontend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    # Los archivos estaticos con hash pueden cachearse; el html nunca
    location ~* \.(?:js|css|png|jpg|jpeg|svg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
