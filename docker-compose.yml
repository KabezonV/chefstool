# Chefstool completo en un comando:  docker compose up --build
# Antes: copia .env.ejemplo a .env (los valores de PostgreSQL local ya vienen puestos).
services:
  # PostgreSQL propio: la aplicacion no necesita ningun servicio de base de datos de pago.
  # En produccion se apunta DB_HOST a la instancia gestionada (por ejemplo RDS) y este
  # servicio se puede quitar.
  postgres:
    image: postgres:17-alpine
    container_name: chefstool-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-chefstool}
      POSTGRES_USER: ${DB_USER:-chefstool}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chefstool}
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-chefstool} -d ${DB_NAME:-chefstool}']
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      # Solo para poder conectarse con psql/DBeaver desde el equipo; no es necesario
      - '${DB_PUBLIC_PORT:-5433}:5432'

  backend:
    build: ./chefstool-backend
    container_name: chefstool-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-chefstool}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      CHEFSTOOL_JWT_SECRET: ${CHEFSTOOL_JWT_SECRET}
      CHEFSTOOL_CORS: ${CHEFSTOOL_CORS:-http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.16.*:*}
      CHEFSTOOL_ENLACE_DIRECTO: ${CHEFSTOOL_ENLACE_DIRECTO:-false}
      CHEFSTOOL_ALMACEN: ${CHEFSTOOL_ALMACEN:-local}
      CHEFSTOOL_OCR_VISION_URL: ${CHEFSTOOL_OCR_VISION_URL:-https://generativelanguage.googleapis.com/v1beta}
      CHEFSTOOL_OCR_VISION_CLAVE: ${CHEFSTOOL_OCR_VISION_CLAVE:-}
      CHEFSTOOL_OCR_VISION_MODELO: ${CHEFSTOOL_OCR_VISION_MODELO:-gemini-3.5-flash}
      # Almacen de albaranes en S3 (opcional; por defecto se usa el volumen local)
      CHEFSTOOL_S3_BUCKET: ${CHEFSTOOL_S3_BUCKET:-}
      CHEFSTOOL_S3_REGION: ${CHEFSTOOL_S3_REGION:-eu-south-2}
      CHEFSTOOL_S3_ENDPOINT: ${CHEFSTOOL_S3_ENDPOINT:-}
      CHEFSTOOL_S3_ACCESS_KEY: ${CHEFSTOOL_S3_ACCESS_KEY:-}
      CHEFSTOOL_S3_SECRET_KEY: ${CHEFSTOOL_S3_SECRET_KEY:-}
    volumes:
      # Solo se usa si CHEFSTOOL_ALMACEN=local
      - albaranes:/app/uploads
    # La API no se publica: se llega a ella por el proxy de nginx (mismo dominio,
    # sin CORS). Si necesitas depurarla, descomenta y usa otro puerto libre.
    expose:
      - '8080'
    # ports:
    #   - '8090:8080'

  frontend:
    build:
      context: ./chefstool-frontend
      args:
        VITE_API_URL: /api
    container_name: chefstool-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8081:80'

volumes:
  albaranes:
  datos:
