server.port=8080

# Credenciales: se leen de variables de entorno (o del archivo .env local, no versionado)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# El pooler de Supabase (modo sesion) limita a 15 conexiones en total
spring.datasource.hikari.maximum-pool-size=5

# El esquema lo gobierna Flyway; Hibernate solo valida que las entidades encajen
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# La base ya tenia tablas creadas por ddl-auto: parte de la version 0 y aplica V1 en adelante
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
