server.port=8080

# Credenciales: se leen de variables de entorno (o del archivo .env local, no versionado)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool pequeno: vale tanto para un PostgreSQL local como para RDS con limite de conexiones
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000

# El esquema lo gobierna Flyway; Hibernate solo valida que las entidades encajen
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# La base ya tenia tablas creadas por ddl-auto: parte de la version 0 y aplica V1 en adelante
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Los albaranes pueden ser fotos de movil: sube el limite por defecto (1 MB)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Autenticacion: secreto HMAC para firmar los JWT (minimo 32 caracteres)
chefstool.seguridad.habilitada=${CHEFSTOOL_SEGURIDAD:true}
chefstool.seguridad.jwt-secret=${CHEFSTOOL_JWT_SECRET:chefstool-dev-secret-cambiar-en-produccion-32+}
chefstool.seguridad.jwt-horas=12
# Falla al arrancar si el secreto sigue siendo el de desarrollo (lo activa el perfil prod)
chefstool.seguridad.estricto=${CHEFSTOOL_ESTRICTO:false}
# Limite de intentos de login/recuperacion por correo + IP
chefstool.seguridad.intentos-maximos=5
chefstool.seguridad.intentos-ventana-minutos=15

# OCR de imagenes: binario de Tesseract e idioma (en el contenedor se instala tesseract-ocr-spa)
chefstool.ocr.tesseract=${CHEFSTOOL_OCR_TESSERACT:tesseract}
chefstool.ocr.idioma=${CHEFSTOOL_OCR_IDIOMA:spa}

# Origenes del frontend autorizados para llamar a la API (lista separada por comas)
chefstool.cors.origenes=${CHEFSTOOL_CORS:http://localhost:5173,http://localhost:5180,http://192.168.1.153:5180}

# Recuperacion de contrasena: sin proveedor de correo, el enlace se escribe en el log.
# En demostracion se puede devolver en la respuesta para probar el flujo.
chefstool.auth.enlace-directo=${CHEFSTOOL_ENLACE_DIRECTO:false}

# Almacen de archivos: local (disco) o s3 (bucket privado; tambien vale MinIO)
chefstool.almacenamiento.tipo=${CHEFSTOOL_ALMACEN:local}
chefstool.almacenamiento.directorio=${CHEFSTOOL_UPLOADS:./uploads}
chefstool.almacenamiento.s3.bucket=${CHEFSTOOL_S3_BUCKET:}
chefstool.almacenamiento.s3.region=${CHEFSTOOL_S3_REGION:eu-south-2}
# Opcionales: endpoint propio (MinIO) y claves explicitas. Si no se ponen, el SDK usa
# las credenciales por defecto de AWS (rol IAM, variables de entorno o perfil).
chefstool.almacenamiento.s3.endpoint=${CHEFSTOOL_S3_ENDPOINT:}
chefstool.almacenamiento.s3.access-key=${CHEFSTOOL_S3_ACCESS_KEY:}
chefstool.almacenamiento.s3.secret-key=${CHEFSTOOL_S3_SECRET_KEY:}
